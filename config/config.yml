# Main application settings
app:
  use_testnet: false
  # AI service URL and credentials will go here
  ai_service_url: "http://localhost:5001/predict"

# GCP configuration for Vertex AI
gcp:
  project_id: "your-gcp-project-id" # Should be loaded from env
  region: "us-central1" # Or your preferred region

# Redis configuration
redis:
  host: "redis"
  port: 6379
  db: 0

# Telegram notification settings
telegram:
  # bot_token and chat_id should be set via environment variables
  # TELEGRAM_BOT_TOKEN
  # TELEGRAM_CHAT_ID
  enabled: true

# Trading parameters
# This section contains the legacy TA-based parameters.
# Most of these will be deprecated by the AI model,
# but we keep them for now for reference and potential fallback logic.
trading:
  symbol: 'ETH/USDT' # This will become dynamic based on AI
  timeframe: '1m'
  fee_rate: 0.0004

  # Risk Management
  risk_percentage: 2.0
  max_daily_trades: 24
  max_daily_loss_percent: 5.0
  max_drawdown_percent: 5.0
  stop_loss_percent: 1.5
  profit_target_percent: 1.0 # Will likely be determined by AI
  max_positions: 3
  max_consecutive_losses: 3
  daily_profit_target: 3.0
  max_position_loss_percent: 2.0
  max_single_trade_risk: 0.02
  min_risk_reward_ratio: 1.5

  # Position Sizing
  min_position_size: 0.004
  max_position_size: 0.05
  min_notional_value: 11.0
  max_notional_value: 1000.0
  initial_position_size: 0.005
  min_trade_amount: 0.004
  min_order_value: 11.0
  position_sizing_factor: 0.02
  dynamic_position_scaling: true
  position_scaling_factor: 0.8

  # Timeouts and Intervals
  cleanup_timeout: 30
  position_timeout: 300
  position_max_duration: 7200
  position_update_interval: 30
  min_trade_interval: 300
  order_timeout: 30

  # Slippage
  max_slippage: 0.002

  # Trailing Stop
  initial_profit_for_trailing_stop: 0.005
  trailing_distance_pct: 0.001

  # Partial Take Profit
  partial_tp_1: 0.4
  partial_tp_2: 0.3
  tp1_target: 0.5
  tp2_target: 0.8

  # Precision
  price_precision: 8
  amount_precision: 8

  # --- Legacy Technical Analysis Parameters ---
  # These will be removed once the AI logic is fully implemented.
  legacy_ta:
    ema_short_period: 5
    ema_long_period: 13
    atr_period: 14
    max_atr_threshold: 1.0
    volume_ma_period: 12
    min_volume_usdt: 1000
    min_volume_multiplier: 0.5
    max_spread_percent: 0.5
    market_impact_threshold: 0.02
    max_volatility_threshold: 0.03
    high_volatility_threshold: 0.02
    low_volatility_threshold: 0.003
    high_volatility_adjustment: 0.2
    low_volatility_adjustment: 0.1
    rsi_period: 14
    rsi_overbought: 65
    rsi_oversold: 35
    price_stability_threshold: 0.002
    adx_threshold: 15
    momentum_threshold: 0
    trend_strength_threshold: 0.0001
    min_candles_required: 100
    max_open_orders: 3
    min_liquidity_ratio: 0.05
    min_profit_threshold: 0.2
    funding_rate_threshold: 0.01
    position_sizing_atr_multiplier: 2.0
    price_change_threshold: 0.003
    momentum_lookback: 5
    trend_lookback: 5
    min_position_multiplier: 1.0
    max_position_multiplier: 2.0
    volume_impact_threshold: 0.05
    trend_adjustment_factor: 0.2
    volume_ma_length: 20
    min_volume_threshold: 5000
    trend_strength_weight: 0.4
    momentum_weight: 0.3
    volume_weight: 0.2
    direction_weight: 0.1
